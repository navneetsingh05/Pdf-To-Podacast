<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="25" fill="url(#grad)" />
  <!-- Microphone Base/Handle -->
  <rect x="45" y="65" width="10" height="20" rx="3" fill="#ffffff" />
  <!-- Microphone Stand -->
  <path d="M 30 55 A 20 20 0 0 0 70 55" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <!-- Microphone Head -->
  <rect x="38" y="20" width="24" height="40" rx="12" fill="#ffffff" />
</svg>
